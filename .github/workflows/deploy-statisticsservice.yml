
name: Build and Deploy StatisticsService

on:
  push:
    branches:
      - main
    paths:
      - 'StatisticsService/**'
      - '.github/workflows/deploy-statisticsservice.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: rg-cloudcomputing-lab
      ACR_NAME: cloudlab319985
      ACR_LOGIN_SERVER: cloudlab319985.azurecr.io
      CONTAINER_APP: final-statistics-service
      IMAGE_NAME: statistics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore StatisticsService/StatisticsService.csproj

      - name: Build
        run: dotnet build StatisticsService/StatisticsService.csproj --configuration Release --no-restore

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and Push Docker Image
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"
          docker build -f StatisticsService/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Azure Container Apps
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Verify Deployment
        run: |
          az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{State:properties.provisioningState,Running:properties.runningStatus,Image:properties.template.containers[0].image}" \
            --output table

      - name: Health Check
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            "https://final-statistics-service.blackrock-2676f93e.northeurope.azurecontainerapps.io/api/health"