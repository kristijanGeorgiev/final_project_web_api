
name: Build and Deploy AuthService

on:
  push:
    branches:
      - main
    paths:
      - "AuthService/**"
      - ".github/workflows/deploy-authservice.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: authservice-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-cloudcomputing-lab
  ACR_NAME: cloudlab319985
  IMAGE_NAME: auth-service
  CONTAINER_APP: final-auth-service

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore AuthService/AuthService.csproj

      - name: Build AuthService
        run: >
          dotnet build AuthService/AuthService.csproj
          --configuration Release
          --no-restore

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"

          docker build \
            --file AuthService/Dockerfile \
            --tag "$IMAGE" \
            AuthService

      - name: Push Docker image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE"

      - name: Deploy to Azure Container Apps
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Verify deployed image
        run: |
          EXPECTED="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"

          ACTUAL=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$EXPECTED" = "$ACTUAL"